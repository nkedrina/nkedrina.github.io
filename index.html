<!DOCTYPE html>
<html lang="ru">
<head>
    <title>@nkedrina</title>
    <meta charset="UTF-8">
    <meta name="type" value="app" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="@nkedrina">
    <meta property="og:description" content="Портфолио медиахудожника: интерактивные инсталляции, свет, генеративная графика и AV-выступления.">
    <meta name="description" content="портфолио медиахудожника насти кедриной: интерактивные инсталляции, свет, генеративная графика и av-выступления.">
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="apple-touch-icon" href="images/icon.png">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved === 'light' ? 'light' : 'dark';
                if (!saved) localStorage.setItem('theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Moderustic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <a class="skip" href="#main">К содержимому</a>

    <header class="hdr top" id="hdr">
        <a class="brand" href="index.html" aria-label=""><span class="full" id="brandFull"></span><span class="mono" id="brandMono"></span></a>
        <nav class="nav" aria-label="Основная навигация">
            <a href="#/about" data-p="/about">обо мне</a>
            <a href="#/portfolio" data-p="/portfolio">проекты</a>
            <a href="#/exhibitions" data-p="/exhibitions">выставки</a>
            <a href="#/contacts" data-p="/contacts">контакты</a>
        </nav>
        <span class="hdr-sp" aria-hidden="true"></span>
    </header>
    <button class="tgl" id="themeBtn" type="button" data-theme-toggle aria-label="Переключить тему оформления">
        <span class="d"><i class="fa-solid fa-moon" aria-hidden="true"></i></span>
        <span class="l"><i class="fa-solid fa-sun" aria-hidden="true"></i></span>
    </button>

    <main id="main" tabindex="-1"></main>
    <footer class="foot" id="footer"></footer>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Проект" hidden></div>
    <div class="quick" id="quick" role="dialog" aria-modal="true" aria-label="Краткая информация о проекте" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="data.js" defer></script>
    <script src="utils.js" defer></script>
    <script src="render.js" defer></script>
    
</body>
</html>
